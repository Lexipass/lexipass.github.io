<style>
:root{--bg:#f8fafc;--card:#fff;--text:#0f172a;--muted:#475569;--primary:#2563eb;--border:#e2e8f0;--danger:#dc2626;--soft:#e3f2fd}
@media (prefers-color-scheme:dark){:root{--bg:#0b0f19;--card:#151c2c;--text:#f8fafc;--muted:#a8b3c7;--primary:#60a5fa;--border:#1e293b;--danger:#f87171;--soft:#1a1d2d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:28px 18px 64px}
header.brand{display:flex;align-items:center;gap:12px;margin-bottom:8px}
header.brand .logo{width:44px;height:44px;border-radius:11px;background:#102a63;display:grid;place-items:center;color:#ffe047;font-weight:800;font-size:24px}
header.brand b{font-size:22px}
h1{font-size:28px;line-height:1.25;margin:18px 0 6px}
h2{font-size:19px;margin:30px 0 8px}
h3{font-size:16px;margin:22px 0 6px}
.card h3{margin-top:0}
p{margin:0 0 10px;color:var(--muted)}
ul,ol{margin:0 0 12px;padding-left:22px;color:var(--muted)}
li{margin:4px 0}
a{color:var(--primary)}
.chip{display:inline-block;background:var(--soft);color:var(--primary);border-radius:10px;padding:4px 12px;font-size:13px;font-weight:600;margin:4px 0 14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px 20px;margin:16px 0}
nav.links{display:flex;gap:14px;flex-wrap:wrap;margin:18px 0}
footer{margin-top:40px;padding-top:16px;border-top:1px solid var(--border);font-size:13px;color:var(--muted)}
.warn{border-color:var(--danger)}
</style>
